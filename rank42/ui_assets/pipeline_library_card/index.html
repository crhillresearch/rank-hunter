<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --rh-text:#31333f;
    --rh-muted:rgba(49,51,63,.58);
    --rh-hover:rgba(127,127,127,.08);
    --rh-border:rgba(127,127,127,.24);
    --rh-primary:#2563eb;
    --rh-danger:#c94a4a;
    --rh-surface:#ffffff;
    --rh-shadow:rgba(15,23,42,.06);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:transparent; overflow:hidden; }
  body {
    color:var(--rh-text);
    font-family:var(--rh-font,"Source Sans Pro",system-ui,sans-serif);
  }
  .pipeline {
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:12px;
    align-items:center;
    min-height:76px;
    padding:11px 10px 11px 14px;
    border:1px solid var(--rh-border);
    border-radius:10px;
    background:var(--rh-surface);
    cursor:pointer;
    box-shadow:0 1px 3px var(--rh-shadow);
    transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease;
  }
  .pipeline:hover {
    border-color:color-mix(in srgb,var(--rh-primary) 26%,var(--rh-border));
    box-shadow:0 4px 12px var(--rh-shadow);
    transform:translateY(-1px);
  }
  .pipeline.editing {
    border-color:color-mix(in srgb,var(--rh-primary) 58%,var(--rh-border));
    box-shadow:inset 3px 0 0 var(--rh-primary),0 3px 10px var(--rh-shadow);
  }
  .copy { min-width:0; }
  .headline {
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .name {
    font-size:15px;
    line-height:1.2;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .badge {
    flex:0 0 auto;
    padding:2px 7px;
    border-radius:999px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--rh-primary);
    background:color-mix(in srgb,var(--rh-primary) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--rh-primary) 25%,transparent);
  }
  .meta,.summary {
    margin-top:4px;
    color:var(--rh-muted);
    font-size:12px;
    line-height:1.2;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .summary { margin-top:3px; }
  .actions {
    display:flex;
    gap:5px;
    align-items:center;
  }
  button.action {
    width:36px;
    height:36px;
    border:0;
    border-radius:8px;
    padding:0;
    background:transparent;
    color:var(--rh-muted);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  button.action:hover { color:var(--rh-text); background:var(--rh-hover); }
  button.delete:hover { color:var(--rh-danger); }
  .confirm-label {
    color:var(--rh-muted);
    font-size:12px;
    font-weight:650;
    white-space:nowrap;
  }
  button.confirm-choice {
    border:0;
    border-radius:7px;
    padding:7px 9px;
    background:transparent;
    color:var(--rh-text);
    font:inherit;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }
  button.confirm-choice.ok { color:var(--rh-danger); }
  button.confirm-choice.cancel { color:var(--rh-muted); }
  button.confirm-choice:hover { background:var(--rh-hover); }
  .fa-icon { width:15px; height:15px; display:block; fill:currentColor; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICONS={
  "copy":{viewBox:"0 0 448 512",path:"M384 336l-192 0c-17.7 0-32-14.3-32-32l0-240c0-17.7 14.3-32 32-32l140.1 0c8.5 0 16.6 3.4 22.6 9.4l52 52c6 6 9.4 14.1 9.4 22.6L416 304c0 17.7-14.3 32-32 32zM64 160l64 0 0 144c0 35.3 28.7 64 64 64l128 0 0 80c0 17.7-14.3 32-32 32L64 480c-17.7 0-32-14.3-32-32L32 192c0-17.7 14.3-32 32-32z"},
  "trash":{viewBox:"0 0 448 512",path:"M135.2 17.7L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-7.2-14.3C307.4 6.8 296.3 0 284.2 0L163.8 0c-12.1 0-23.2 6.8-28.6 17.7zM416 128L32 128 53.2 467c1.6 25.3 22.6 45 48 45l245.6 0c25.4 0 46.4-19.7 48-45L416 128z"}
};
function sendMessageToStreamlitClient(type,data){
  window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data),"*");
}
function init(){sendMessageToStreamlitClient("streamlit:componentReady",{apiVersion:1});}
function setFrameHeight(){sendMessageToStreamlitClient("streamlit:setFrameHeight",{height:Math.max(1,document.documentElement.scrollHeight)});}
function sendValue(value){sendMessageToStreamlitClient("streamlit:setComponentValue",{value});}
function emit(action){sendValue({action,nonce:Date.now()});}
function icon(name){
  const i=ICONS[name];
  return '<svg class="fa-icon" data-icon="'+name+'" viewBox="'+i.viewBox+'" aria-hidden="true"><path d="'+i.path+'"></path></svg>';
}
function applyTheme(theme,palette){
  const root=document.documentElement.style;
  if(theme){
    if(theme.textColor)root.setProperty("--rh-text",theme.textColor);
    if(theme.secondaryBackgroundColor)root.setProperty("--rh-hover",theme.secondaryBackgroundColor);
    if(theme.primaryColor)root.setProperty("--rh-primary",theme.primaryColor);
    if(theme.font)root.setProperty("--rh-font",theme.font);
    const text=theme.textColor||"#31333f";
    root.setProperty("--rh-muted","color-mix(in srgb, "+text+" 58%, transparent)");
    root.setProperty("--rh-border","color-mix(in srgb, "+text+" 20%, transparent)");
    root.setProperty("--rh-shadow","color-mix(in srgb, "+text+" 12%, transparent)");
  }
  if(palette){
    if(palette["rh-text"]){
      root.setProperty("--rh-text",palette["rh-text"]);
      root.setProperty("--rh-shadow","color-mix(in srgb, "+palette["rh-text"]+" 12%, transparent)");
    }
    if(palette["rh-muted"])root.setProperty("--rh-muted",palette["rh-muted"]);
    if(palette["rh-card"])root.setProperty("--rh-surface",palette["rh-card"]);
    if(palette["rh-surface-hover"])root.setProperty("--rh-hover",palette["rh-surface-hover"]);
    if(palette["rh-border"])root.setProperty("--rh-border",palette["rh-border"]);
    if(palette["rh-primary"])root.setProperty("--rh-primary",palette["rh-primary"]);
    if(palette["rh-danger"])root.setProperty("--rh-danger",palette["rh-danger"]);
  }
}
function action(actionName,iconName,title,className){
  const b=document.createElement("button");
  b.type="button";
  b.className="action "+className;
  b.title=title;
  b.setAttribute("aria-label",title);
  b.innerHTML=icon(iconName);
  b.addEventListener("click",e=>{
    e.stopPropagation();
    if(!actionName.startsWith("confirm-"))emit(actionName);
  });
  return b;
}
let currentArgs={};
function confirmDelete(actions){
  actions.replaceChildren();
  const prompt=document.createElement("span");
  prompt.className="confirm-label";
  prompt.textContent="Delete pipeline?";
  const ok=document.createElement("button");
  ok.type="button";
  ok.className="confirm-choice ok";
  ok.textContent="OK";
  ok.addEventListener("click",e=>{e.stopPropagation();emit("delete");});
  const cancel=document.createElement("button");
  cancel.type="button";
  cancel.className="confirm-choice cancel";
  cancel.textContent="Cancel";
  cancel.addEventListener("click",e=>{e.stopPropagation();render(currentArgs);});
  actions.append(prompt,ok,cancel);
}
function render(args){
  currentArgs=args||{};
  const root=document.getElementById("root");
  root.replaceChildren();

  const row=document.createElement("div");
  row.className="pipeline"+(args.editing?" editing":"");
  row.addEventListener("click",()=>emit("open"));

  const copy=document.createElement("div");
  copy.className="copy";
  const headline=document.createElement("div");
  headline.className="headline";
  const name=document.createElement("div");
  name.className="name";
  name.textContent=args.name||"Pipeline";
  headline.appendChild(name);
  if(args.editing){
    const badge=document.createElement("span");
    badge.className="badge";
    badge.textContent="EDITING";
    headline.appendChild(badge);
  }
  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent=args.meta||"";
  const summary=document.createElement("div");
  summary.className="summary";
  summary.textContent=args.summary||"";
  copy.append(headline,meta,summary);

  const actions=document.createElement("div");
  actions.className="actions";
  actions.appendChild(action("duplicate","copy","Duplicate pipeline","duplicate"));
  const del=action("confirm-delete","trash","Delete pipeline","delete");
  del.addEventListener("click",e=>{
    e.stopImmediatePropagation();
    e.stopPropagation();
    confirmDelete(actions);
  });
  actions.appendChild(del);

  row.append(copy,actions);
  root.appendChild(row);
  requestAnimationFrame(setFrameHeight);
}
function onDataFromPython(event){
  if(event.data.type!=="streamlit:render")return;
  const args=event.data.args||{};
  applyTheme(event.data.theme,args.palette||{});
  render(args);
}
window.addEventListener("message",onDataFromPython);
window.addEventListener("load",()=>setTimeout(setFrameHeight,0));
init();
</script>
</body>
</html>
