<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --rh-text: #31333f;
    --rh-muted: rgba(49,51,63,.58);
    --rh-surface: transparent;
    --rh-surface-soft: rgba(127,127,127,.045);
    --rh-hover: rgba(127,127,127,.08);
    --rh-border: rgba(127,127,127,.24);
    --rh-favorite: #f5c542;
    --rh-add: #1fa65d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    color: var(--rh-text);
    font-family: var(--rh-font, "Source Sans Pro", system-ui, sans-serif);
  }
  .row {
    display: grid;
    grid-template-columns: 42px minmax(0,1fr) 42px 42px;
    align-items: center;
    min-height: 54px;
    border: 1px solid var(--rh-border);
    border-radius: 10px;
    background: var(--rh-surface);
    overflow: hidden;
  }
  .row:hover { background: var(--rh-hover); }
  .copy { min-width: 0; padding: 7px 10px; }
  .name {
    font-size: 14px;
    line-height: 1.2;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .detail {
    margin-top: 5px;
    color: var(--rh-muted);
    font-size: 12px;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button.action {
    height: 54px;
    border: 0;
    border-left: 1px solid transparent;
    padding: 0;
    background: transparent;
    color: var(--rh-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  button.action:hover {
    color: var(--rh-text);
    background: var(--rh-hover);
  }
  button.action.favorite.active { color: var(--rh-favorite); }
  button.action.add { color: var(--rh-add); }
  button.action:disabled {
    cursor: default;
    opacity: .3;
    background: transparent;
  }
  .fa-icon { width: 16px; height: 16px; display: block; fill: currentColor; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICONS = {
  "star": {viewBox:"0 0 576 512", path:"M316.9 18c-5.3-11-16.5-18-28.9-18s-23.6 7-28.9 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3L288 439.8l128.1 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.2 329 542.4 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381 150.3 316.9 18z"},
  "circle-info": {viewBox:"0 0 512 512", path:"M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM216 336l24 0 0-64-24 0c-13.3 0-24-10.7-24-24s10.7-24 24-24l48 0c13.3 0 24 10.7 24 24l0 88 8 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-80 0c-13.3 0-24-10.7-24-24s10.7-24 24-24zm40-208a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"},
  "plus": {viewBox:"0 0 448 512", path:"M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"}
};

function sendMessageToStreamlitClient(type, data) {
  const outData = Object.assign({isStreamlitMessage: true, type}, data);
  window.parent.postMessage(outData, "*");
}
function init() {
  sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
}
function setFrameHeight() {
  sendMessageToStreamlitClient("streamlit:setFrameHeight", {
    height: Math.max(1, document.documentElement.scrollHeight)
  });
}
function sendValue(value) {
  sendMessageToStreamlitClient("streamlit:setComponentValue", {value});
}
function emit(action) {
  sendValue({action, nonce: Date.now()});
}
function icon(name) {
  const i = ICONS[name];
  return '<svg class="fa-icon" data-icon="'+name+'" viewBox="'+i.viewBox+'" aria-hidden="true" focusable="false"><path d="'+i.path+'"></path></svg>';
}
function applyTheme(theme, palette) {
  const root = document.documentElement.style;
  if (theme) {
    if (theme.textColor) root.setProperty("--rh-text", theme.textColor);
    if (theme.secondaryBackgroundColor) root.setProperty("--rh-hover", theme.secondaryBackgroundColor);
    if (theme.font) root.setProperty("--rh-font", theme.font);
    const text = theme.textColor || "#31333f";
    root.setProperty("--rh-muted", "color-mix(in srgb, "+text+" 58%, transparent)");
    root.setProperty("--rh-border", "color-mix(in srgb, "+text+" 20%, transparent)");
  }
  if (palette) {
    if (palette["rh-text"]) root.setProperty("--rh-text", palette["rh-text"]);
    if (palette["rh-muted"]) root.setProperty("--rh-muted", palette["rh-muted"]);
    if (palette["rh-card"]) root.setProperty("--rh-surface", palette["rh-card"]);
    if (palette["rh-card-2"]) root.setProperty("--rh-surface-soft", palette["rh-card-2"]);
    if (palette["rh-surface-hover"]) root.setProperty("--rh-hover", palette["rh-surface-hover"]);
    if (palette["rh-border"]) root.setProperty("--rh-border", palette["rh-border"]);
    if (palette["rh-success"]) root.setProperty("--rh-add", palette["rh-success"]);
    if (palette["rh-warning"]) root.setProperty("--rh-favorite", palette["rh-warning"]);
  }
}
function actionButton(action, iconName, title, className, disabled=false) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "action "+className;
  button.title = title;
  button.setAttribute("aria-label", title);
  button.disabled = !!disabled;
  button.innerHTML = icon(iconName);
  if (!disabled) button.addEventListener("click", () => emit(action));
  return button;
}
function render(args) {
  const root = document.getElementById("root");
  root.replaceChildren();

  const row = document.createElement("div");
  row.className = "row";

  const favorite = actionButton(
    "favorite",
    "star",
    args.favorite ? "Remove favorite" : "Add to favorites",
    "favorite"+(args.favorite ? " active" : "")
  );

  const copy = document.createElement("div");
  copy.className = "copy";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = args.module || "";
  const detail = document.createElement("div");
  detail.className = "detail";
  detail.textContent = args.detail || "";
  copy.append(name, detail);

  const info = actionButton("details", "circle-info", "Module details", "info");
  const add = actionButton(
    "add",
    "plus",
    args.can_add ? (args.repeat ? "Add another copy" : "Add to pipeline") : "Already in pipeline",
    "add",
    !args.can_add
  );

  row.append(favorite, copy, info, add);
  root.appendChild(row);
  requestAnimationFrame(setFrameHeight);
}
function onDataFromPython(event) {
  if (event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  applyTheme(event.data.theme, args.palette || {});
  render(args);
}
window.addEventListener("message", onDataFromPython);
window.addEventListener("load", () => setTimeout(setFrameHeight, 0));
init();
</script>
</body>
</html>
